*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; color-scheme: light; overflow-x: hidden; }
body {
  margin: 0; min-height: 100svh; display: grid; place-items: center;
  font-family: "Archivo", system-ui, -apple-system, sans-serif;
  font-size: clamp(1rem, 0.97rem + 0.16vw, 1.08rem); line-height: 1.6; color: var(--ink);
  background-color: var(--cream); background-image: var(--paper-tex);
  background-size: 220px; background-blend-mode: multiply;
  -webkit-font-smoothing: antialiased;
  padding: clamp(2rem, 6vw, 4rem) clamp(1.25rem, 5vw, 3rem);
}
.wordwall { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
.wordwall__inner {
  position: absolute; inset: -8% -3%;
  display: grid; align-content: center; justify-content: center;
  transform: rotate(-3deg) scale(1.02); opacity: 0.07;
}
.wordwall span {
  font-family: "Anton", sans-serif; text-transform: uppercase; white-space: nowrap;
  font-size: clamp(3.5rem, 20vw, 21rem); line-height: 0.94; letter-spacing: 0.02em;
  color: var(--ink);
}
.wordwall span:nth-child(even) { margin-left: -7%; }
.wordwall span:nth-child(3n)   { margin-left: 5%; }
.wrap { position: relative; z-index: 1; }
.wrap {
  width: 100%; max-width: 1180px; display: grid; gap: clamp(1.5rem, 5vw, 3.5rem);
  grid-template-columns: 1fr; align-items: center; justify-items: center; text-align: center;
}
@media (min-width: 760px) {
  .wrap { grid-template-columns: 1.15fr 0.85fr; text-align: left; justify-items: start; }
  .mascot { justify-self: center; }
}
.eyebrow {
  font-size: clamp(0.72rem, 0.68rem + 0.2vw, 0.82rem); font-weight: 700;
  letter-spacing: 0.22em; text-transform: uppercase; color: var(--red-deep);
  display: inline-flex; align-items: center; gap: 0.6em; margin: 0;
}
.eyebrow::before { content: "\2605"; color: var(--red); font-size: 0.9em; }
.code {
  font-family: "Anton", Impact, sans-serif; font-weight: 400; text-transform: uppercase;
  color: var(--red); font-size: clamp(5rem, 2rem + 17vw, 13rem); line-height: 0.82;
  letter-spacing: 0.01em; text-shadow: 5px 5px 0 var(--ink); margin: 0.5rem 0 0;
  font-variant-numeric: tabular-nums;
}
h1 {
  font-family: "Anton", Impact, sans-serif; font-weight: 400; text-transform: uppercase;
  font-size: clamp(1.6rem, 1.1rem + 2.2vw, 2.8rem); line-height: 0.96;
  margin: 0.7rem 0 0.6rem; text-wrap: balance;
}
p.lead { margin: 0 0 1.7rem; max-width: 40ch; color: var(--ink-soft); font-weight: 500; text-wrap: pretty; }
.actions { display: flex; flex-wrap: wrap; gap: 0.9rem; justify-content: inherit; }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 0.55em;
  font-family: "Archivo", sans-serif; font-weight: 700; font-size: 1rem;
  letter-spacing: 0.02em; text-transform: uppercase; text-decoration: none;
  padding: 0.85em 1.6em; border-radius: 100px; border: 2.5px solid var(--ink);
  -webkit-tap-highlight-color: transparent; touch-action: manipulation;
  transition: transform 0.25s var(--ease), box-shadow 0.25s var(--ease), background-color 0.25s var(--ease);
}
.btn--red { background: var(--red); color: #fff; box-shadow: 4px 4px 0 var(--ink); }
.btn--red:hover { transform: translate(-2px,-2px); box-shadow: 6px 6px 0 var(--ink); background: var(--red-deep); }
.btn--ghost { background: var(--card); color: var(--ink); box-shadow: 4px 4px 0 var(--ink); }
.btn--ghost:hover { transform: translate(-2px,-2px); box-shadow: 6px 6px 0 var(--ink); background: #fff; }
.btn:active { transform: translate(0,0); box-shadow: 2px 2px 0 var(--ink); }
:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; border-radius: 3px; }
.mascot {
  width: clamp(150px, 34vw, 300px); aspect-ratio: 350 / 600;
  background: var(--mascot) no-repeat center / contain;
  transform: rotate(-3deg); filter: drop-shadow(5px 5px 0 var(--ink));
  animation: floaty 5.5s ease-in-out infinite;
}
@keyframes floaty {
  0%, 100% { transform: translateY(0) rotate(-3deg); }
  50%       { transform: translateY(-7px) rotate(-1deg); }
}
.note {
  margin: 1.5rem 0 0; font-size: 0.8rem; font-weight: 800; letter-spacing: 0.12em;
  text-transform: uppercase; color: var(--ink-soft);
}
@media (prefers-reduced-motion: reduce) {
  .mascot { animation: none; }
  * { transition-duration: 0.001ms !important; animation-duration: 0.001ms !important; }
}
</style>
</head>
<body>
<div class="wordwall" aria-hidden="true"><div class="wordwall__inner">
  <span>Nothing Here</span><span>Nothing Here</span><span>Nothing Here</span>
  <span>Nothing Here</span><span>Nothing Here</span><span>Nothing Here</span>
</div></div>
<main class="wrap">
  <div>
    <p class="eyebrow">Nothing baking here</p>
    <p class="code">404</p>
    <h1>This page got eaten</h1>
    <p class="lead">Somebody got to it before you did. The cookies are still where you left them.</p>
    <div class="actions">
      <a class="btn btn--red" href="./">Back to the cookies</a>
      <a class="btn btn--ghost" href="./#receipt">Build a box</a>
    </div>
    <p class="note">Min 4 pcs &middot; Pre-order only</p>
  </div>
  <div class="mascot" role="img" aria-label="The FYN mascot, mid-bite"></div>
</main>
<script>
/* The wall covers the viewport, and the viewport is not a fixed height, so the
   line count is measured rather than assumed. */
function fillWall() {
  var inner = document.querySelector(".wordwall__inner");
  var probe = inner && inner.firstElementChild;
  if (!probe) return;
  var word = inner.getAttribute("data-word") || probe.textContent;
  inner.setAttribute("data-word", word);
  var lineH = probe.getBoundingClientRect().height;
  if (!lineH) return;
  var need = Math.ceil(document.querySelector(".wordwall").getBoundingClientRect().height / lineH) + 2;
  while (inner.children.length < need) {
    var s = document.createElement("span");
    s.textContent = word;
    inner.appendChild(s);
  }
  while (inner.children.length > need) inner.lastElementChild.remove();
}
fillWall();
if (document.fonts && document.fonts.ready) document.fonts.ready.then(fillWall);
window.addEventListener("load", fillWall);
var wallTimer = null;
window.addEventListener("resize", function () { clearTimeout(wallTimer); wallTimer = setTimeout(fillWall, 180); });
</script>
</body>
